name: ncaab
on:
  schedule:
    - cron: "23 12 * * *"            # 12:23 UTC: every game of the US night is over
  push:
    paths: ["boards/**"]
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "YYYY-MM-DD: fetch every missing results day since (first run: 2025-11-03)"
        required: false
permissions:
  contents: write
concurrency: ncaab
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas tabulate
      - run: python ncaab_grade.py selftest
      - name: restore ledger
        run: gh release download ledger -p ncaab.sqlite --clobber || echo "no ledger yet"
      - name: sync
        run: python ncaab_grade.py sync ${{ inputs.backfill_from && format('--backfill-from {0}', inputs.backfill_from) || '' }}
      - name: save ledger
        run: |
          gh release view ledger >/dev/null 2>&1 || gh release create ledger --title ledger --notes "ncaab.sqlite, replaced on every run"
          gh release upload ledger ncaab.sqlite --clobber
      - name: commit
        run: |
          git config user.name ncaab-bot
          git config user.email ncaab-bot@users.noreply.github.com
          echo ncaab.sqlite >> .git/info/exclude              # the ledger lives in the release, never in git
          git rm --cached -q --ignore-unmatch ncaab.sqlite
          git add -A
          git diff --cached --quiet || (git commit -m "sync $(date -u +%F)" && git push)
